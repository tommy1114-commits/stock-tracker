<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#456F95" />
      <stop offset="100%" stop-color="#2D4D6B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#23394E" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="url(#blueGrad)" />
  
  <!-- Trend Card / Chart Lines -->
  <g filter="url(#shadow)">
    <!-- Baseline grid -->
    <line x1="96" y1="360" x2="416" y2="360" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>
    <line x1="96" y1="260" x2="416" y2="260" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Uptrend Path -->
    <path d="M 112 330 Q 180 320 220 270 T 320 220 T 400 150" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Uptrend Peak Dot -->
    <circle cx="400" cy="150" r="16" fill="#F6F8FB" stroke="#456F95" stroke-width="6" />
    
    <!-- Area Under Curve -->
    <path d="M 112 330 Q 180 320 220 270 T 320 220 T 400 150 L 400 360 L 112 360 Z" fill="#FFFFFF" fill-opacity="0.1" />

    <!-- Coin / Dividend Accent -->
    <circle cx="160" cy="180" r="32" fill="#E3EBF3" />
    <text x="160" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#23394E" text-anchor="middle">$</text>
  </g>
</svg>
